name: Release

# Runs when a GitHub release is published. Builds the distribution, checks the
# tag matches the package version, attaches the files to the release and, when
# the repository variable PYPI_TRUSTED_PUBLISHING is "true", publishes to PyPI
# through Trusted Publishing (OIDC, no stored token).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release distribution
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv run --locked python -c 'import reflex_monocharts as m; print(m.__version__)')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${version}"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/

  github-assets:
    name: Attach files to GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-monocharts/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
