[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-monocharts"
dynamic = ["version"]
description = "Monochromatic, rounded chart cards for Reflex - a Python port of the Monocharts design system built on rx.recharts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = ["reflex", "reflex-custom-components", "charts", "recharts", "monocharts", "dataviz"]

dependencies = ["reflex>=0.9.0"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Reflex",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-monocharts"
Source = "https://github.com/ecrespo/reflex-monocharts"
Issues = "https://github.com/ecrespo/reflex-monocharts/issues"

[project.optional-dependencies]
dev = ["build", "twine", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit[toml]>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.dynamic]
version = { attr = "reflex_monocharts.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["reflex_monocharts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["Claude outputs", "monocharts_demo/.web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "DTZ", "RUF", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Demo data and seeded grids use `random` for looks, not for security.
"custom_components/reflex_monocharts/data.py" = ["S311"]
"monocharts_demo/**" = ["S311"]
"tests/**" = ["S101", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["reflex_monocharts"]

[tool.bandit]
exclude_dirs = ["tests", "monocharts_demo/.web", "monocharts_demo/.venv"]
# B311: `random` only generates demo datasets, never secrets or tokens.
skips = ["B311"]
